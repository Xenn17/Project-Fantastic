<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Buat Password Baru — F4NTASTIC</title><link rel="icon" href="assets/logo-transparant.png"><link rel="stylesheet" href="css/auth.css?v=20261029-1"><link rel="stylesheet" href="css/forgot-password.css?v=20261029-2"></head>
<body>
  <main class="recovery-page">
    <header class="recovery-top"><a class="auth-brand" href="index.html"><img src="assets/logo-transparant.png" alt=""><span><strong>F4N<span>'T</span></strong><small>WE ARE FANTASTIC</small></span></a><a class="recovery-top-link" href="login.html"><span aria-hidden="true">←</span> KEMBALI KE LOGIN</a></header>
    <section class="recovery-main" aria-labelledby="resetTitle">
      <p class="recovery-kicker">ACCOUNT RECOVERY</p>
      <h1 id="resetTitle">BUAT<br><b>PASSWORD.</b></h1>
      <p class="recovery-lead">Buat password baru yang kuat untuk mengamankan akun F4NTASTIC kamu.</p>
      <form class="recovery-form" id="resetPasswordForm" novalidate>
        <label for="newPassword">PASSWORD BARU</label>
        <div class="recovery-input"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Minimal 8 karakter"></div>
        <small class="recovery-hint">Gunakan minimal 8 karakter.</small>
        <label for="confirmPassword" style="margin-top:20px">ULANGI PASSWORD</label>
        <div class="recovery-input"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Ketik ulang password"></div>
        <p class="recovery-message" id="resetMessage" role="status" aria-live="polite"></p>
        <button type="submit">SIMPAN PASSWORD <span aria-hidden="true">↗</span></button>
      </form>
      <div class="recovery-note"><span aria-hidden="true">✳</span> Setelah tersimpan, kamu bisa masuk menggunakan password baru.</div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/reset-password.js?v=20261029-2"></script>
</body></html>

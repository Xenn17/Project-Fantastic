<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Buat Password Baru — F4NTASTIC</title><link rel="icon" href="assets/logo-transparant.png"><link rel="stylesheet" href="css/auth.css?v=20261029-1"><link rel="stylesheet" href="css/forgot-password.css?v=20261029-2"><style>
  :root{--gold:#d8b45a;--text:#f5f3ed;--muted:#969696;--body:Manrope,Arial,sans-serif;--display:'Barlow Condensed',Impact,sans-serif}*{box-sizing:border-box}body{margin:0;background:#090909;color:var(--text);font-family:var(--body)}.recovery-page{min-height:100vh;padding:0 24px;display:flex;flex-direction:column;position:relative;overflow:hidden;background:radial-gradient(ellipse at 85% 20%,#d8b45a20,transparent 35%),#090909}.recovery-top{width:min(100%,1180px);height:84px;margin:auto;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff14}.recovery-top .auth-brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none}.recovery-top .auth-brand img{width:34px;height:34px}.recovery-top .auth-brand strong{font:800 27px/1 var(--display);letter-spacing:1px}.recovery-top .auth-brand strong span{color:var(--gold)}.recovery-top .auth-brand small{display:block;margin-top:4px;color:var(--muted);font-size:7px;letter-spacing:2px}.recovery-top-link{color:#aaa;font-size:10px;font-weight:700;text-decoration:none}.recovery-top-link span{color:var(--gold);font-size:15px;margin-right:6px}.recovery-main{width:min(100%,560px);margin:auto;padding:42px 44px 34px;border:1px solid #d8b45a3d;background:#101010e6;box-shadow:0 24px 70px #000b}.recovery-kicker{display:flex;align-items:center;gap:11px;margin:0 0 18px;color:var(--gold);font-size:9px;font-weight:800;letter-spacing:2.4px}.recovery-kicker:before{content:'';width:24px;height:1px;background:var(--gold)}.recovery-main h1{margin:0;font:800 clamp(58px,9vw,82px)/.84 var(--display);letter-spacing:-1px}.recovery-main h1 b{color:var(--gold)}.recovery-lead{margin:20px 0 30px;color:var(--muted);font-size:11px;line-height:1.8}.recovery-form label{display:block;margin-bottom:9px;color:#c9c9c9;font-size:9px;font-weight:800;letter-spacing:1.6px}.recovery-input{display:flex;align-items:center;border:1px solid #ffffff24;background:#0b0b0b}.recovery-input:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px #d8b45a17}.recovery-input svg{width:17px;height:17px;margin-left:14px;fill:none;stroke:#777;stroke-width:1.5}.recovery-input input{width:100%;height:50px;padding:0 14px;border:0;outline:0;background:transparent;color:var(--text);font:12px var(--body)}.recovery-hint{display:block;margin-top:8px;color:#6f6f6f;font-size:9px}.recovery-form button{width:100%;height:48px;margin-top:16px;border:0;background:var(--gold);color:#111;cursor:pointer;font-size:9px;font-weight:800;letter-spacing:1px;text-align:left;padding:0 15px}.recovery-form button span{float:right;font-size:15px}.recovery-message{display:none;margin:14px 0 0;padding:11px 12px;border:1px solid #d8b45a47;background:#d8b45a12;color:#e6d39b;font-size:10px;line-height:1.6}.recovery-message:not(:empty){display:block}.recovery-message.is-error{border-color:#e58a7e6b;background:#782d2624;color:#efaaa0}.recovery-note{margin-top:20px;color:#666;font-size:9px}.recovery-note span{color:var(--gold)}.recovery-bottom{margin-top:22px;color:#666;font-size:8px;font-weight:800;letter-spacing:1.2px}.recovery-bottom a{color:var(--gold)}@media(max-width:600px){.recovery-page{padding:0 18px}.recovery-top{height:72px}.recovery-top-link{font-size:0}.recovery-top-link span{font-size:20px}.recovery-main{padding:31px 22px 27px}.recovery-main h1{font-size:clamp(58px,17vw,78px)}}
.recovery-message{align-items:center;gap:11px;border-radius:2px;border-left:3px solid var(--gold);box-shadow:0 8px 25px #0005}.recovery-message:not(:empty){display:flex}.recovery-message:before{content:"✓";display:grid;place-items:center;flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#17130a;font-weight:900}.recovery-message.is-error{border-left-color:#a84e43}.recovery-message.is-error:before{content:"!";background:#a84e43;color:#fff}.password-field{position:relative}.password-field input{padding-right:48px}.password-toggle{position:absolute!important;right:0;top:0;width:43px!important;height:100%!important;margin:0!important;padding:0!important;border:0!important;background:transparent!important;color:#777!important;display:grid;place-items:center;box-shadow:none!important;transform:none!important}.password-toggle:hover,.password-toggle.is-visible{color:#d8b45a!important;background:transparent!important}.password-toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin:0}</style></head>
<body>
  <main class="recovery-page">
    <header class="recovery-top"><a class="auth-brand" href="index.html"><img src="assets/logo-transparant.png" alt=""><span><strong>F4N<span>'T</span></strong><small>WE ARE FANTASTIC</small></span></a><a class="recovery-top-link" href="login.html"><span aria-hidden="true">←</span> KEMBALI KE LOGIN</a></header>
    <section class="recovery-main" aria-labelledby="resetTitle">
      <p class="recovery-kicker">ACCOUNT RECOVERY</p>
      <h1 id="resetTitle">BUAT<br><b>PASSWORD.</b></h1>
      <p class="recovery-lead">Buat password baru yang kuat untuk mengamankan akun F4NTASTIC kamu.</p>
      <form class="recovery-form" id="resetPasswordForm" novalidate>
        <label for="newPassword">PASSWORD BARU</label>
        <div class="recovery-input password-field"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Minimal 8 karakter"><button type="button" class="password-toggle" data-target="newPassword" aria-label="Tampilkan password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/></svg></button></div>
        <small class="recovery-hint">Gunakan minimal 8 karakter.</small>
        <label for="confirmPassword" style="margin-top:20px">ULANGI PASSWORD</label>
        <div class="recovery-input password-field"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Ketik ulang password"><button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Tampilkan password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/></svg></button></div>
        <p class="recovery-message" id="resetMessage" role="status" aria-live="polite"></p>
        <button type="submit">SIMPAN PASSWORD <span aria-hidden="true">↗</span></button>
      </form>
      <div class="recovery-note"><span aria-hidden="true">✳</span> Setelah tersimpan, kamu bisa masuk menggunakan password baru.</div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/reset-password.js?v=20261029-2"></script>
</body></html>

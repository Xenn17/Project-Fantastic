<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#090a0d" />
    <title>Kelola Divisi — F4NTASTIC</title>
    <link rel="icon" href="assets/favicon.ico" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/division-editor.css" />
    <link rel="stylesheet" href="css/tokens.css?v=20261109-redesign" />
  </head>
  <body class="division-page">
    <header class="site-header">
      <a class="brand" href="directory.html"
        ><img src="assets/logo-transparant.png" alt="F4NTASTIC"
      /></a>
      <nav class="main-nav">
        <a href="directory.html">Kembali ke Directory</a>
      </nav>
    </header>
    <main class="editor-shell">
      <div class="editor-top">
        <div>
          <p class="division-kicker">F4NTASTIC DIVISION MANAGEMENT</p>
          <h1 id="editorTitle">KELOLA DIVISI</h1>
          <p id="editorAccess">Memeriksa hak akses...</p>
        </div>
        <a class="division-btn" href="directory.html">KEMBALI</a>
      </div>
      <div id="editorNotice" class="editor-notice">Memuat data divisi...</div>
      <form id="divisionForm" class="editor-panel" hidden>
        <h2>Informasi Divisi</h2>
        <div class="editor-grid">
          <label
            >Nama Leader<input id="leaderName" maxlength="50" required /></label
          ><label>Squad ID<input id="squadId" maxlength="30" /></label
          ><label>WhatsApp<input id="whatsapp" maxlength="25" /></label
          ><label
            >Kapasitas Maksimum<input
              id="capacity"
              type="number"
              min="1"
              max="25"
              required /></label
          ><label
            >Status Rekrutmen<select id="recruitment">
              <option value="RECRUITING">RECRUITING</option>
              <option value="CLOSED">CLOSED</option>
            </select></label
          ><label
            >Spotlight<select id="spotlight">
              <option value="false">Tidak</option>
              <option value="true">Ya</option>
            </select></label
          ><label class="wide"
            >Deskripsi<textarea
              id="description"
              maxlength="700"
              required
            ></textarea></label
          ><label class="wide"
            >Pengumuman<textarea id="announcement" maxlength="120"></textarea>
          </label>
        </div>
        <div class="editor-preview">
          <h3>Preview kartu</h3>
          <div id="previewCard"></div>
        </div>
        <button class="division-btn primary" type="submit">
          SIMPAN PERUBAHAN
        </button>
      </form>
      <section id="membersPanel" class="editor-panel" hidden>
        <div class="panel-heading">
          <h2>Data Anggota</h2>
          <span id="memberCount"></span>
        </div>
        <form id="memberForm" class="member-form">
          <label
            >Nickname<input id="memberNick" maxlength="30" required /></label
          ><label
            >ID Mobile Legends<input
              id="memberId"
              inputmode="numeric"
              maxlength="25"
              pattern="[0-9]{1,25}"
              required /></label
          ><label>Role 1<select id="memberRole1" required></select></label
          ><label>Role 2 (opsional)<select id="memberRole2"></select></label
          ><button class="division-btn primary" type="submit">
            TAMBAH MEMBER
          </button>
        </form>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>NICK</th>
                <th>ID ML</th>
                <th>ROLE</th>
                <th>AKSI</th>
              </tr>
            </thead>
            <tbody id="memberRows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/gallery-supabase-config.js"></script>
    <script src="js/session-nav.js"></script>
    <script src="js/division-editor.js"></script>
  </body>
</html>

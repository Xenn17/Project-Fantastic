<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Profil Member — F4NTASTIC</title><link rel="icon" href="assets/logo-transparant.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800;900&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/profile.css"></head><body><main class="profile-page"><section class="profile-shell"><a class="profile-back" href="index.html">← KEMBALI KE WEBSITE</a><header class="profile-hero"><div class="profile-avatar" id="avatar">F</div><div><p class="profile-kicker">— F4NTASTIC MEMBER / PROFILE</p><h1 id="profileName">Profil Member</h1><p class="profile-handle" id="profileHandle">@member</p></div><span class="profile-badge">MEMBER</span></header><div class="profile-layout"><section class="profile-panel"><div class="panel-heading"><div><p class="profile-kicker">01 / IDENTITAS</p><h2>DATA DIRI.</h2></div><span class="required-note">* WAJIB DIISI</span></div><form id="profileForm"><label>NAMA LENGKAP *<input id="fullName" required placeholder="Nama lengkap kamu"></label><label>NOMOR TELEPON *<input id="phone" type="tel" required placeholder="08xxxxxxxxxx"></label><div class="profile-fields"><label>ID MOBILE LEGENDS *<input id="mlId" required placeholder="Contoh: 123456789"></label><label>SERVER ML *<input id="mlServer" required placeholder="Contoh: 1234"></label></div><div class="profile-fields"><label>JENIS KELAMIN *<select id="gender" required><option value="">Pilih jenis kelamin</option><option value="Laki-laki">Laki-laki</option><option value="Perempuan">Perempuan</option></select></label><label>TANGGAL LAHIR *<input id="birthDate" type="date" required></label></div><p class="profile-status-message" id="profileStatus"></p><button class="profile-save" type="submit">SIMPAN PROFIL <span>↗</span></button></form></section><aside class="profile-side"><p class="profile-kicker">02 / ACCOUNT</p><h2>WELCOME<br><b>TO F4NT.</b></h2><div class="side-item"><small>EMAIL TERDAFTAR</small><strong id="profileEmail">—</strong></div><div class="side-item"><small>STATUS PROFIL</small><strong id="completion" class="profile-status">BELUM LENGKAP</strong></div><p class="side-copy">Lengkapi data diri agar profil komunitasmu siap digunakan.</p><button class="profile-logout" id="logout" type="button" onclick="window.logoutProfile(event)">KELUAR DARI AKUN <span>↗</span></button></aside></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
function logoutProfile(event){if(event)event.preventDefault();try{sessionStorage.clear();localStorage.removeItem('f4ntastic-user');}catch{};location.href='index.html?logout='+Date.now()};const db=window.supabase.createClient('https://uxkieyunztzhiwrocnei.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV4a2lleXVuenR6aGl3cm9jbmVpIiwicm9sZSI6ImFub24iIiwiaWF0IjoxNzkyMzA0MDgyLCJleHAiOjIxMDc4ODAwODJ9.nlWhlGbagxwZ2-XeHEa195n5sQmRtXn3xutTISDXR70');const raw=sessionStorage.getItem('f4ntastic-user');if(!raw)location.href='login.html';else{const u=JSON.parse(raw),label=u.username||u.email?.split('@')[0]||'Member';const $=s=>document.querySelector(s);$('#profileName').textContent=u.name||label;$('#profileHandle').textContent='@'+label;$('#profileEmail').textContent=u.email||'Memuat...';$('#avatar').textContent=label[0].toUpperCase();async function load(){const authResult=await db.auth.getUser();const authEmail=authResult.data?.user?.email;if(authEmail){u.email=authEmail;$('#profileEmail').textContent=authEmail;sessionStorage.setItem('f4ntastic-user',JSON.stringify(u))}const {data,error}=await db.from('profiles').select('email,full_name,phone,ml_id,ml_server,gender,birth_date').eq('id',u.id).maybeSingle();if(error){$('#profileStatus').textContent='Profil tambahan belum terbaca, tetapi email akun sudah dimuat dari Auth.';return}if(data){if(data.email){u.email=data.email;$('#profileEmail').textContent=data.email;sessionStorage.setItem('f4ntastic-user',JSON.stringify(u))}['fullName','phone','mlId','mlServer','gender','birthDate'].forEach((id,i)=>{const key=['full_name','phone','ml_id','ml_server','gender','birth_date'][i];$('#'+id).value=data[key]||''});const complete=['full_name','phone','ml_id','ml_server','gender','birth_date'].every(k=>data[k]);$('#completion').textContent=complete?'PROFIL LENGKAP':'BELUM LENGKAP';u.profileComplete=complete;u.name=data.full_name||u.name;sessionStorage.setItem('f4ntastic-user',JSON.stringify(u));$('#profileName').textContent=data.full_name||u.name||label}}load();$('#profileForm').onsubmit=async e=>{e.preventDefault();const values={full_name:$('#fullName').value.trim(),phone:$('#phone').value.trim(),ml_id:$('#mlId').value.trim(),ml_server:$('#mlServer').value.trim(),gender:$('#gender').value,birth_date:$('#birthDate').value};if(Object.values(values).some(v=>!v)){ $('#profileStatus').textContent='Semua data bertanda * wajib diisi.';return}const {error}=await db.from('profiles').update(values).eq('id',u.id);if(error){$('#profileStatus').textContent='Gagal menyimpan profil. Jalankan SQL profile terlebih dahulu.';return}u.profileComplete=true;u.name=values.full_name;sessionStorage.setItem('f4ntastic-user',JSON.stringify(u));$('#profileName').textContent=values.full_name;$('#profileHandle').textContent='@'+label;$('#completion').textContent='PROFIL LENGKAP';$('#profileStatus').textContent='Profil berhasil disimpan.'}}</script></body></html>
